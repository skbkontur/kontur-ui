    draw a line before old docs versions

  */
  a[id^="list"][href*="tech.skbkontur.ru/kontur-ui"]

    a[id^="list"][href*="https://ui.gitlab-pages.kontur.host/docs/storybook/"]

  {
    border-top: 1px solid rgba(0, 0, 0, 0.32);
    flex-wrap: wrap;
  }

  #storybook-explorer-tree [aria-expanded] {
    border: 0 !important;

    &:not([data-nodetype="group"]) {
      padding-top: 0;
    }

    & + [data-title] > div {
      margin-bottom: 0 !important;
    }

    [data-action] {
      border-radius: 4px;
    }

    /* Exteral storybooks with 1 story. Move 1st link to title */
    /* &:has(+ div [data-nodetype="document"]:only-child),
    &:has(+ div [data-nodetype="document"]:only-child) + div > div {
      padding: 0;
      border: 0;
      margin: 8px 0;
    } */

    & + div [data-nodetype="document"]:only-child {
      margin-top: -25px;
      font-size: 0;
    }

    &
      + div
      [data-nodetype="document"]:not([data-selected="true"]):only-child:hover {
      background: #029cfd;
      opacity: 0.1;
    }

    & + div [data-nodetype="document"]:only-child * {
      width: 0;
      opacity: 0;
    }

    /* Exteral storybooks with 1 story. Disable collapse button */
    &:has(+ div [data-nodetype="document"]:only-child) {
      position: relative;
      z-index: 1;
      pointer-events: none;
    }

    &:has(+ div [data-nodetype="document"]:only-child)
      [data-action="collapse-ref"]
      span:first-child {
      opacity: 0;
    }

    /* Exteral storybooks with 1 story. Disable tab keys for collapse button */
    &:has(+ div [data-nodetype="document"]:only-child)
      [data-action="collapse-ref"] {
      visibility: hidden;
    }

    &:has(+ div [data-nodetype="document"]:only-child)
      [data-action="collapse-ref"] {
      visibility: visible;
    }

    &:has(+ div [data-nodetype="document"]:only-child) aside {
      pointer-events: all;
    }

    /* Exteral storybooks with 1 story. Invert text */
    &:has(+ div > div > div[data-selected="true"]:only-child) * {
      color: white;
    }
  }

  .dom-content-loaded div:has(> #preview-loader) {
    display: none;
  }

  [data-radix-scroll-area-viewport] + div > div:before {
    min-width: 24px !important;
  }
</style>

<script>
  // Prevent removing storybook hash first 3 seconds after load
  (function () {
    const targetHash = window.location.hash;
    if (!targetHash) return;
    let allowChanges = false;

    const originalReplaceState = window.history.replaceState;
    const originalPushState = window.history.pushState;

    const lockHash = (args) => {
      if (!allowChanges && args[2]) {
        const url = new URL(args[2], window.location.origin);
        if (url.hash !== targetHash) {
          url.hash = targetHash;
          args[2] = url.pathname + url.search + url.hash;
        }
      }
      return args;
    };

    window.history.replaceState = function (...args) {
      return originalReplaceState.apply(this, lockHash(args));
    };

    window.history.pushState = function (...args) {
      return originalPushState.apply(this, lockHash(args));
    };

    window.addEventListener(
      "hashchange",
      (e) => {
        if (!allowChanges && window.location.hash !== targetHash) {
          window.location.hash = targetHash;
        }
      },
      { passive: true },
    );

    setTimeout(() => {
      allowChanges = true;
    }, 7000);
  })();
</script>

<script>
  // treat links to old docs in storybook versions dropdown as external links and allow to open them in separate tabs
  // by default, they are treated as links to hosted storybooks and tries to open in the same master storybook
  document.addEventListener(
    "click",
    (e) => {
      const anchor = e.target.closest("a[id^=list-item]");
      if (anchor) {
        if (
          // react-ui and react-ui-validation
          anchor.href.startsWith("https://tech.skbkontur.ru/react-ui") ||
          // packages from old ui-parkings owned by IF
          anchor.href.startsWith(
            "https://ui.gitlab-pages.kontur.host/docs/ui-parking-old-if/#/",
          )
        ) {
          e.stopPropagation();
        }
      }
    },
    { capture: true },
  );

  document.addEventListener("DOMContentLoaded", () => {
    document.body.classList.add("dom-content-loaded");
  });
</script>
