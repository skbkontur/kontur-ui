<style>
  .sidebar-item svg {
    color: #222 !important;
  }

  .sidebar-item [data-selected="true"] {
    background: rgba(0, 0, 0, 0.32);
  }

  button.sidebar-item,
  .sidebar-item a {
    font-size: 15px !important;
    padding-top: 4px;
    padding-bottom: 4px;
  }

  .sidebar-item[data-selected="true"],
  .sidebar-item[data-selected="true"]:hover,
  .sidebar-item[data-selected="true"]:focus {
    background: #1f87ef;
  }

  .sidebar-item[data-selected="true"] svg {
    color: white !important;
  }

  #storybook-explorer-searchfield {
    border-radius: 2px;
  }

  /* 
    draw a line before old docs versions 
    in storybook's versions dropdowns 
  */
  :not(a[id^="list"][href*="tech.skbkontur.ru"])
    + a[id^="list"][href*="tech.skbkontur.ru"] {
    border-top: 1px solid currentColor;
    flex-wrap: wrap;
  }

  #storybook-explorer-tree [aria-expanded] {
    /* Exteral storybooks with 1 story. Move 1st link to title */
    &:has(+ div [data-nodetype=document]:only-child),
    &:has(+ div [data-nodetype=document]:only-child) + div > div {
      padding: 0;
      border: 0;
      margin: 8px 0;
    }

    & + div [data-nodetype=document]:only-child {
      margin-top: -32px;
      font-size: 0;
    }

    & + div [data-nodetype=document]:not([data-selected=true]):only-child:hover {
      background: #029cfd;
      opacity: 0.1;
    }

    & + div [data-nodetype=document]:only-child * {
      width: 0;
      opacity: 0;
    }

    /* Exteral storybooks with 1 story. Disable collapse button */
    &:has(+ div [data-nodetype=document]:only-child) {
      position: relative;
      z-index: 1;
      pointer-events: none;
    }

    &:has(+ div [data-nodetype=document]:only-child) [data-action=collapse-ref] span:first-child {
      opacity: 0;
    }

    /* Exteral storybooks with 1 story. Disable tab keys for collapse button */
    &:has(+ div [data-nodetype=document]:only-child) [data-action=collapse-ref] {
      visibility: hidden;
    }

    &:has(+ div [data-nodetype=document]:only-child) [data-action=collapse-ref] {
      visibility: visible;
    }

    &:has(+ div [data-nodetype=document]:only-child) aside {
      pointer-events: all;
    }

    /* Exteral storybooks with 1 story. Invert text */
    &:has(+ div > div > div[data-selected=true]:only-child) * {
      color: white;
    }
  }
</style>

<script>
  // treat links to old docs in storybook versions dropdown as external links and allow to open them in separate tabs
  // by default, they are treated as links to hosted storybooks and tries to open in the same master storybook
  document.addEventListener(
    "click",
    (e) => {
      const anchor = e.target.closest("a[id^=list-item]");
      if (anchor && anchor.href.startsWith("https://tech.skbkontur.ru/")) {
        e.stopPropagation();
      }
    },
    { capture: true }
  );
</script>
