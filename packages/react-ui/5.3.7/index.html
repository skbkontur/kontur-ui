    />
    <link

      href="./sb-common-assets/nunito-sans-bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./sb-common-assets/fonts.css" />

    <link href="./sb-manager/runtime.js" rel="modulepreload" />

    
    <link href="./sb-addons/essentials-controls-0/manager-bundle.js" rel="modulepreload" />

      <link href="https://s.kontur.ru/common-v2/fonts/LabGrotesque/LabGrotesque.css" rel="stylesheet" />

<style>
  .sidebar-item svg {
    color: #222 !important;
  }

  .sidebar-item [data-selected='true'] {
    background: rgba(0, 0, 0, 0.32);
  }

  button.sidebar-item,
  .sidebar-item a {
    font-size: 15px !important;
    padding-top: 4px;
    padding-bottom: 4px;
  }

  .sidebar-item[data-selected='true'],
  .sidebar-item[data-selected='true']:hover,
  .sidebar-item[data-selected='true']:focus {
    background: #1f87ef;
  }

  .sidebar-item[data-selected='true'] svg {
    color: white !important;
  }

  #storybook-explorer-searchfield {
    border-radius: 2px;
  }

  /* Disable Storybook's sidebar hotkey '1' that conflicts with DateInput typing */
  /* TODO: remove hack after fix <DateInput> onKeyDown behaviour in IF-2158 */
  #storybook-explorer-menu {
    visibility: hidden !important;
  }

  #storybook-explorer-menu > * {
    visibility: visible !important;
  }
</style>
 

    <style>
      #storybook-root[hidden] {
        display: none !important;
      }
    </style>

    
  </head>
  <body>
    <div id="root"></div>

    
    <script>
      
        
          window['FEATURES'] = {
  "warnOnLegacyHierarchySeparator": true,
  "buildStoriesJson": false,
  "storyStoreV7": true,
  "argTypeTargetsV7": true,
  "legacyDecoratorFileOrder": false,
  "disallowImplicitActionsInRenderV8": false
};
        
      
        
          window['REFS'] = {};
        
      
        
          window['LOGLEVEL'] = "info";
        
      
        
          window['DOCS_OPTIONS'] = {
  "docsMode": true,
  "defaultName": "Docs",
  "autodocs": "tag"
};
        
      
        
          window['CONFIG_TYPE'] = "PRODUCTION";
        
      
        
      
        
      
    </script>
    

    <script type="module">
      import './sb-manager/runtime.js';

      
      import './sb-addons/essentials-controls-0/manager-bundle.js';
      
      import './sb-addons/essentials-actions-1/manager-bundle.js';
      
      import './sb-addons/essentials-backgrounds-2/manager-bundle.js';
      
      import './sb-addons/essentials-viewport-3/manager-bundle.js';
      
      import './sb-addons/essentials-toolbars-4/manager-bundle.js';
      
      import './sb-addons/essentials-measure-5/manager-bundle.js';
      
      import './sb-addons/essentials-outline-6/manager-bundle.js';
      
      import './sb-addons/storybook-docs-7/manager-bundle.js';
      
    </script>

    <link href="./sb-preview/runtime.js" rel="prefetch" as="script" />
  </body>
</html>
