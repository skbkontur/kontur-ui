<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>@storybook/core - Storybook</title>

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    
    <style>
      @font-face {
        font-family: 'Nunito Sans';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./sb-common-assets/nunito-sans-regular.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Nunito Sans';
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url('./sb-common-assets/nunito-sans-italic.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Nunito Sans';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('./sb-common-assets/nunito-sans-bold.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Nunito Sans';
        font-style: italic;
        font-weight: 700;
        font-display: swap;
        src: url('./sb-common-assets/nunito-sans-bold-italic.woff2') format('woff2');
      }
    </style>

    <link href="./sb-manager/runtime.js" rel="modulepreload" />

    <link href="./sb-addons/storybook-docs-9/manager-bundle.js" rel="modulepreload" />
      <link href="https://s.kontur.ru/common-v2/fonts/LabGrotesque/LabGrotesque.css" rel="stylesheet" />

<style>
  .sidebar-item svg {
    color: #222 !important;
  }

  .sidebar-item [data-selected='true'] {
    background: rgba(0, 0, 0, 0.32);
  }

  button.sidebar-item,
  .sidebar-item a {
    font-size: 15px !important;
    padding-top: 4px;
    padding-bottom: 4px;
  }

  .sidebar-item[data-selected='true'],
  .sidebar-item[data-selected='true']:hover,
  .sidebar-item[data-selected='true']:focus {
    background: #1f87ef;
  }

  .sidebar-item[data-selected='true'] svg {
    color: white !important;
  }

  #storybook-explorer-searchfield {
    border-radius: 2px;
  }

  /* Disable Storybook's sidebar hotkey '1' that conflicts with DateInput typing */
  /* TODO: remove hack after fix <DateInput> onKeyDown behaviour in IF-2158 */
  #storybook-explorer-menu {
    visibility: hidden !important;
  }

  #storybook-explorer-menu > * {
    visibility: visible !important;
  }
</style>

<script
  src="https://context7.com/widget.js"
  data-library="/websites/tech_skbkontur_ru_kontur-ui"
  data-color="#3d3d3d"
></script>
 

    <style>
      #storybook-root[hidden] {
        display: none !important;
      }
    </style>

    
  </head>
  <body>
    <div id="root"></div>

    
    <script>
      
        
          window['FEATURES'] = {
  "argTypeTargetsV7": true,
  "legacyDecoratorFileOrder": false,
  "disallowImplicitActionsInRenderV8": true
};
        
      
        
          window['REFS'] = {};
        
      
        
          window['LOGLEVEL'] = "info";
        
      
        
          window['DOCS_OPTIONS'] = {
  "docsMode": true,
  "defaultName": "Docs",
  "autodocs": "tag"
};
        
      
        
          window['CONFIG_TYPE'] = "PRODUCTION";
        
      
        
      
        
      
        
          window['TAGS_OPTIONS'] = {
  "dev-only": {
    "excludeFromDocsStories": true
  },
  "docs-only": {
    "excludeFromSidebar": true
  },
  "test-only": {
    "excludeFromSidebar": true,
    "excludeFromDocsStories": true
  }
};
        
      
        
          window['STORYBOOK_RENDERER'] = "react";
        
      
        
          window['STORYBOOK_BUILDER'] = "@storybook/builder-webpack5";
        
      
        
          window['STORYBOOK_FRAMEWORK'] = "@storybook/react-webpack5";
        
      
    </script>
    

    <script type="module">
      import './sb-manager/globals-runtime.js';
      
      
        import './sb-addons/storybook-core-core-server-presets-0/common-manager-bundle.js';
      
        import './sb-addons/essentials-controls-1/manager-bundle.js';
      
        import './sb-addons/essentials-actions-2/manager-bundle.js';
      
        import './sb-addons/essentials-docs-3/manager-bundle.js';
      
        import './sb-addons/essentials-backgrounds-4/manager-bundle.js';
      
        import './sb-addons/essentials-viewport-5/manager-bundle.js';
      
        import './sb-addons/essentials-toolbars-6/manager-bundle.js';
      
        import './sb-addons/essentials-measure-7/manager-bundle.js';
      
        import './sb-addons/essentials-outline-8/manager-bundle.js';
      
        import './sb-addons/storybook-docs-9/manager-bundle.js';
      
      
      import './sb-manager/runtime.js';
    </script>
  </body>
</html>
